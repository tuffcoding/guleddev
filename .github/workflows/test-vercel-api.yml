name: Test Vercel API
on:
  workflow_dispatch:

jobs:
  curl_test:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Vercel preview API (POST)
        run: |
          # Using the preview URL you gave (do NOT add extra https://)
          PREVIEW_URL="guleddev-fclwlzcm3-guleddev.vercel.app"

          curl -v -X POST "https://${PREVIEW_URL}/api/create-checkout-session" \
            -H "Content-Type: application/json" \
            -d '{"priceId":"test-price","successUrl":"https://example.com","cancelUrl":"https://example.com"}'
